[build-system]
requires = ["setuptools", "cmake>=3.26,<4", "absl-py"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco"
version = "3.15.1"
authors = [
    {name = "Google DeepMind", email = "mujoco@deepmind.com"},
]
description = "MuJoCo Physics Simulator"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "absl-py",
    "etils[epath]",
    "glfw",
    "numpy",
    "pyopengl",
    "typing-extensions",
    "websockets>=13",
]
dynamic = ["readme", "scripts"]

[project.urls]
Homepage = "https://github.com/google-deepmind/mujoco"
Documentation = "https://mujoco.readthedocs.io/en/3.15.1"
Repository = "https://github.com/google-deepmind/mujoco"
Changelog = "https://mujoco.readthedocs.io/en/3.15.1/changelog.html"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mujoco*"]
exclude = [
    "mujoco.codegen",
    "mujoco.mjpython",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
mujoco = [
    "libmujoco.*.dylib",
    "libmujoco*.so.*",
    "mujoco.dll",
    "include/mujoco/*.h",
    "testdata/*.xml",
    "testdata/*.msh",
    "testdata/*.usda",
    "testdata/*.zip",
    "testdata/*.urdf",
    "sysid/report/templates/*.html",
    "experimental/studio/web/*.html",
    "experimental/studio/web/dist/*",
    "experimental/studio/web/dist/assets/*",
]

[project.optional-dependencies]
sysid = [
    "absl-py",
    "colorama",
    "imageio[ffmpeg]",
    "jinja2",
    "matplotlib",
    "plotly",
    "pyyaml",
    "scipy",
    "tabulate",
    "typing_extensions",
]
usd = [
    "usd-core",
    "pillow"
]

[dependency-groups]
typing = [
    "pybind11-stubgen==3.0.0",
    "ruff==0.17.0",
    "ty==0.0.85",
]

[tool.ruff]
include = ["*.pyi", "mujoco/codegen/generate_stubs.py", "tests/typing/*.py", "tests/test_setup.py"]
indent-width = 2
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PYI"]

[tool.ruff.lint.isort]
known-first-party = ["mujoco"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
force_single_line = true
force_sort_within_sections = true
lexicographical = true
single_line_exclusions = ["typing"]
order_by_type = false
group_by_package = true
line_length = 120
use_parentheses = true
multi_line_output = 3
skip_glob = ["**/*.ipynb"]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = '''(
 .ipynb$
)'''
